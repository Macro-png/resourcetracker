<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>D&D Resource Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="pwa/manifest.json" />
</head>
<body>

  <header class="app-header">
    <h1>Resource Tracker</h1>
    <div class="toolbar">
      <button id="export-btn" aria-label="Export data">⬇ Export</button>
      <button id="import-btn" aria-label="Import data">⬆ Import</button>
      <button id="pwa-install-btn" hidden aria-hidden="true">Install</button>
    </div>
  </header>

  <!-- CHARACTER LIST SCREEN -->
  <main id="character-list-screen" class="screen">
    <ul id="character-list" class="list"></ul>
    <button id="add-character-btn" class="primary-btn" aria-haspopup="dialog">+ Add Character</button>
  </main>

  <!-- SESSION SCREEN -->
  <main id="session-screen" class="screen" hidden>
    <div class="session-toprow">
      <button id="back-btn" class="link-btn">← Back</button>
      <div class="session-title-block">
        <h2 id="character-name" class="character-title"></h2>
        <button id="concentration-toggle" class="concentration-under-btn" aria-pressed="false" aria-label="Toggle concentration">Concentrate</button>
      </div>
    </div>

    <div id="concentration-banner" class="concentration-banner" hidden aria-live="assertive"></div>

    <!-- HP -->
    <section class="card hp-card">
      <div class="hp-main-row">
        <div class="hp-actions">
          <button id="hp-add" class="hp-action-pill heal">HEAL</button>
          <input id="hp-update-amount" type="number" min="0" class="hp-input hp-amount-input" aria-label="HP adjustment amount" />
          <button id="hp-subtract" class="hp-action-pill damage">DAMAGE</button>
        </div>
        <div class="hp-values">
          <div class="hp-labels"><span>Current</span><span>Max</span></div>
          <div class="hp-numbers" role="status" aria-live="polite">
            <span id="hp-current">0</span>
            <span class="slash">/</span>
            <span id="hp-max">0</span>
          </div>
          <div class="hp-subtitle">HIT POINTS</div>
        </div>
        <div class="hp-temp">
          <div class="hp-temp-label">Temp</div>
          <input id="hp-temp-inline" type="number" min="0" class="hp-temp-inline-input" placeholder="--" aria-label="Temporary HP" />
        </div>
      </div>
      <div class="hp-bar" aria-hidden="true">
        <div id="hp-bar-fill" class="hp-bar-fill" style="width:100%"></div>
      </div>
    </section>

    <!-- SPELL SLOTS -->
    <section class="card">
      <h3>Spell Slots</h3>
      <div id="spellslots-container"></div>
      <button id="add-spellslot-btn" class="link-btn">+ Add Spell Slot</button>
    </section>

    <!-- RESOURCES -->
    <section class="card">
      <h3>Resources</h3>
      <div id="resources-container"></div>
      <button id="add-resource-btn" class="link-btn">+ Add Resource</button>
    </section>

    <!-- CONDITIONS -->
    <section class="card">
      <h3>Conditions</h3>
      <div id="condition-grid" class="condition-grid" aria-label="Standard conditions"></div>
    </section>

    <!-- REST -->
    <section class="row card actions">
      <button id="short-rest" class="rest-btn primary-btn">Short Rest</button>
      <button id="long-rest" class="rest-btn primary-btn">Long Rest</button>
    </section>
  </main>

  <!-- MODALS -->
  <div id="character-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="character-modal-title">
    <div class="modal-content">
      <h3 id="character-modal-title">Add Character</h3>
      <form id="character-form">
        <label>Name <input id="character-form-name" name="name" required /></label>
        <label>Max HP <input id="character-form-maxhp" name="maxhp" type="number" min="1" required /></label>
        <label>Full caster level <input id="character-form-fullcaster" name="fullcaster" type="number" min="0" max="20" value="0" /></label>
        <label>Half caster level (Paladins, Rangers) <input id="character-form-halfcaster" name="halfcaster" type="number" min="0" max="20" value="0" /></label>
        <label>Pact magic level (Warlocks) <input id="character-form-pactlevel" name="pactlevel" type="number" min="0" max="20" value="0" /></label>
        <div id="character-form-error" class="form-error" hidden></div>
        <div class="row">
          <button type="submit" class="primary-btn" id="character-save">Save</button>
          <button type="button" id="character-cancel" class="link-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="resource-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="resource-modal-title">
    <div class="modal-content">
      <h3 id="resource-modal-title">Add Resource</h3>
      <form id="resource-form">
        <label>Name <input id="resource-form-name" name="name" required /></label>
        <label>Max <input id="resource-form-max" name="max" type="number" min="1" value="1" required /></label>
        <label>Recovers on
          <select id="resource-form-recoversOn" name="recoversOn">
            <option value="none">None</option>
            <option value="short">Short rest</option>
            <option value="long">Long rest</option>
          </select>
        </label>
        <div id="resource-form-error" class="form-error" hidden></div>
        <div class="row">
          <button type="submit" class="primary-btn" id="resource-save">Save</button>
          <button type="button" id="resource-cancel" class="link-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="spellslot-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="spellslot-modal-title">
    <div class="modal-content">
      <h3 id="spellslot-modal-title">Add Spell Slot</h3>
      <form id="spellslot-form">
        <label>Level (1–9) <input id="spellslot-form-level" name="level" type="number" min="1" max="9" value="1" required /></label>
        <label>Max slots <input id="spellslot-form-max" name="max" type="number" min="0" value="1" required /></label>
        <label>Recovers on
          <select id="spellslot-form-recoversOn" name="recoversOn">
            <option value="none">None</option>
            <option value="short">Short rest</option>
            <option value="long" selected>Long rest</option>
          </select>
        </label>
        <div id="spellslot-form-error" class="form-error" hidden></div>
        <div class="row">
          <button type="submit" class="primary-btn" id="spellslot-save">Save</button>
          <button type="button" id="spellslot-cancel" class="link-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="concentration-modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3>⚠️ Concentration Check!</h3>
      <p id="concentration-modal-text" style="margin: 1rem 0"></p>
      <div class="row">
        <button id="concentration-modal-dismiss" class="primary-btn">Dismiss</button>
      </div>
    </div>
  </div>

  <input id="import-file" type="file" accept="application/json" hidden />

  <!-- Templates -->
  <template id="resource-template">
    <div class="spellslot-item card small resource-item">
      <button class="small-cross slot-remove" aria-label="Remove resource">✕</button>
      <div class="slot-row">
        <div class="slot-left"><div class="resource-label" data-key="label"></div></div>
        <div class="slot-center"><div class="spellslot-controls resource-controls" data-key="controls"></div></div>
        <div class="slot-right"></div>
      </div>
    </div>
  </template>

  <template id="spellslot-template">
    <div class="spellslot-item card small">
      <button class="small-cross slot-remove" aria-label="Remove spell slots">✕</button>
      <div class="slot-row">
        <div class="slot-left"><div class="spellslot-label" data-key="level"></div></div>
        <div class="slot-center"><div class="spellslot-controls" data-key="controls"></div></div>
        <div class="slot-right"></div>
      </div>
    </div>
  </template>

  <div id="toast" class="toast" hidden aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
